<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Python | Dimensional Code Exploration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: #000000;
            color: #ffffff;
            position: relative;
        }

        canvas#bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 3rem 4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px);
            background: rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffd1dc 0%, #b4e7ff 50%, #ffb347 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 8s ease-in-out infinite;
        }

        @keyframes gradient-shift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(20deg); }
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        .exploration-space {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .node-cluster {
            position: absolute;
            width: 600px;
            height: 600px;
            perspective: 1200px;
        }

        .node {
            position: absolute;
            width: 120px;
            height: 120px;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .node-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .node:hover .node-inner {
            transform: rotateY(180deg);
        }

        .node-front, .node-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            overflow: hidden;
        }

        .node-back {
            transform: rotateY(180deg);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .node-label {
            font-size: 0.75rem;
            text-align: center;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            line-height: 1.2;
            opacity: 0.9;
        }

        .node-info {
            font-size: 0.7rem;
            text-align: center;
            opacity: 0.7;
            line-height: 1.4;
        }

        @keyframes orbit {
            0% { transform: rotateZ(0deg) translateX(200px) rotateZ(0deg); }
            100% { transform: rotateZ(360deg) translateX(200px) rotateZ(-360deg); }
        }

        .node:nth-child(1) { animation: orbit 20s linear infinite; }
        .node:nth-child(2) { animation: orbit 22s linear infinite reverse; animation-delay: -5s; }
        .node:nth-child(3) { animation: orbit 24s linear infinite; animation-delay: -10s; }
        .node:nth-child(4) { animation: orbit 26s linear infinite reverse; animation-delay: -8s; }
        .node:nth-child(5) { animation: orbit 25s linear infinite; animation-delay: -12s; }
        .node:nth-child(6) { animation: orbit 23s linear infinite reverse; animation-delay: -3s; }

        .node:hover {
            z-index: 100;
            transform: scale(1.3);
        }

        .mandala {
            position: absolute;
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .mandala svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
            animation: rotate-mandala 30s linear infinite;
        }

        @keyframes rotate-mandala {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fade-in 0.4s ease;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-panel {
            width: 90%;
            max-width: 900px;
            height: 80vh;
            background: linear-gradient(135deg, rgba(50, 50, 60, 0.9), rgba(30, 30, 40, 0.95));
            border: 1px solid rgba(255, 200, 200, 0.2);
            overflow: hidden;
            display: flex;
            animation: panel-rise 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes panel-rise {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-sidebar {
            width: 30%;
            background: rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .modal-main {
            flex: 1;
            padding: 3rem;
            overflow-y: auto;
            position: relative;
        }

        .modal-main::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, rgba(255, 200, 200, 0.5), transparent);
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            line-height: 1.2;
        }

        .modal-code {
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid rgba(255, 200, 200, 0.5);
            padding: 1.5rem;
            margin: 1.5rem 0;
            font-size: 0.85rem;
            overflow-x: auto;
            line-height: 1.6;
            color: #b4e7ff;
            white-space: pre-wrap;
        }

        .modal-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            color: rgba(255, 255, 255, 1);
        }

        .modal-sidebar h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 2rem 0 1rem;
            opacity: 0.7;
        }

        .modal-sidebar p {
            font-size: 0.9rem;
            line-height: 1.6;
            opacity: 0.8;
            margin-bottom: 0.8rem;
        }

        .modal-tag {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            background: rgba(255, 200, 200, 0.1);
            border: 1px solid rgba(255, 200, 200, 0.3);
            font-size: 0.7rem;
            margin: 0.3rem 0.3rem 0 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            animation: pulse-text 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @media (max-width: 1024px) {
            h1 { font-size: 2.5rem; }
            .node { width: 100px; height: 100px; }
            .modal-panel { flex-direction: column; }
            .modal-sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        }

        @media (max-width: 768px) {
            header { padding: 2rem; }
            h1 { font-size: 1.8rem; }
            .exploration-space { padding: 2rem; }
            .modal-panel { width: 95%; height: 90vh; }
            .modal-main { padding: 2rem; }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="content">
        <header>
            <h1>Velvet Python</h1>
            <p class="subtitle">A Dimensional Approach to Code Understanding</p>
        </header>

        <div class="exploration-space">
            <div class="mandala" id="mandala">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
                    <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,200,200,0.2)" stroke-width="0.5"/>
                    <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(180,231,255,0.2)" stroke-width="0.5"/>
                    <g id="petals">
                        <path d="M 100 100 L 100 20" stroke="rgba(255,200,200,0.3)" stroke-width="1" fill="none"/>
                        <path d="M 100 100 L 141.4 58.6" stroke="rgba(255,200,200,0.3)" stroke-width="1" fill="none"/>
                        <path d="M 100 100 L 180 100" stroke="rgba(255,200,200,0.3)" stroke-width="1" fill="none"/>
                        <path d="M 100 100 L 141.4 141.4" stroke="rgba(255,200,200,0.3)" stroke-width="1" fill="none"/>
                        <path d="M 100 100 L 100 180" stroke="rgba(255,200,200,0.3)" stroke-width="1" fill="none"/>
                        <path d="M 100 100 L 58.6 141.4" stroke="rgba(255,200,200,0.3)" stroke-width="1" fill="none"/>
                        <path d="M 100 100 L 20 100" stroke="rgba(255,200,200,0.3)" stroke-width="1" fill="none"/>
                        <path d="M 100 100 L 58.6 58.6" stroke="rgba(255,200,200,0.3)" stroke-width="1" fill="none"/>
                    </g>
                </svg>
            </div>

            <div class="node-cluster" id="nodeCluster"></div>

            <div class="scroll-indicator">EXPLORE • ROTATE • DISCOVER</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-panel">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-sidebar" id="modalSidebar"></div>
            <div class="modal-main" id="modalMain"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function drawBackground(time) {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 200, 200, 0.05)';
            ctx.lineWidth = 1;

            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 20) {
                    const y = canvas.height / 2 + Math.sin((x + time * 0.5) / 100 + i) * 50;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let i = 0; i < 20; i++) {
                const x = (Math.sin(time * 0.0001 + i) * canvas.width) % canvas.width;
                const y = (Math.cos(time * 0.00015 + i * 0.5) * canvas.height) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }

            animationId = requestAnimationFrame(() => drawBackground(time + 1));
        }

        drawBackground(0);

        const files = [
            {
                name: 'ai.py',
                type: 'Core Module',
                category: 'Classification',
                desc: 'Bayes, Rule, Cosine',
                purpose: 'Three foundational classifiers exploring probability, logic, and similarity metrics.',
                learnings: ['Classifier interfaces', 'Bayesian probability', 'Vector math', 'Trade-offs'],
                usage: 'from src.ai import BayesClassifier',
                example: 'classifier.train(texts, labels)\\npredictions = classifier.predict(new_texts)'
            },
            {
                name: 'data_utils.py',
                type: 'Core Module',
                category: 'Data Engineering',
                desc: 'Validation, Loading',
                purpose: 'Deterministic data contracts. Every row validated before processing.',
                learnings: ['Data validation', 'Integrity checking', 'Fast failure', 'Contracts'],
                usage: 'from src.data_utils import load_dataset',
                example: 'df = load_dataset(\"data/train.csv\")\\nvalidate_dataset(df)'
            },
            {
                name: 'ml_pipeline.py',
                type: 'Core Module',
                category: 'Orchestration',
                desc: 'Features, Models, Eval',
                purpose: 'Complete ML workflow orchestration with reproducible metadata.',
                learnings: ['Pipeline architecture', 'Feature engineering', 'Metadata tracking'],
                usage: 'from src.ml_pipeline import run_classification_pipeline',
                example: 'run = run_classification_pipeline(df, seed=42)'
            },
            {
                name: 'run_experiments.py',
                type: 'Script',
                category: 'Automation',
                desc: 'Model Sweeps, Outputs',
                purpose: 'CLI automation for reproducible experiment runs at scale.',
                learnings: ['CLI design', 'Experiment automation', 'Artifact management'],
                usage: 'python scripts/run_experiments.py --epochs 10',
                example: 'python scripts/run_experiments.py --models bayesian cosine'
            },
            {
                name: 'dataset_audit.py',
                type: 'Script',
                category: 'Quality',
                desc: 'Profiling, Detection',
                purpose: 'Comprehensive dataset health analysis and anomaly detection.',
                learnings: ['Data profiling', 'Quality signals', 'Issue detection'],
                usage: 'python scripts/dataset_audit.py --source builtin',
                example: 'python scripts/dataset_audit.py --write-json artifacts/audit.json'
            },
            {
                name: 'tests/',
                type: 'Test Suite',
                category: 'Verification',
                desc: 'Reproducibility, Edge Cases',
                purpose: 'Comprehensive test suite ensuring robustness and reproducibility.',
                learnings: ['Test design', 'Edge cases', 'Regression prevention'],
                usage: 'pytest tests/ -v',
                example: 'pytest tests/test_data_pipeline_utils.py'
            }
        ];

        const cluster = document.getElementById('nodeCluster');
        files.forEach((file) => {
            const node = document.createElement('div');
            node.className = 'node';
            node.innerHTML = `
                <div class="node-inner">
                    <div class="node-front">
                        <div class="node-label">${file.name}</div>
                        <div class="node-info">${file.category}</div>
                    </div>
                    <div class="node-back">
                        <div class="node-info">${file.type}</div>
                        <div style="margin-top: 8px; font-size: 0.65rem; opacity: 0.7;">${file.desc}</div>
                    </div>
                </div>
            `;
            node.addEventListener('click', () => openModal(file));
            cluster.appendChild(node);
        });

        function openModal(file) {
            document.getElementById('modalSidebar').innerHTML = `
                <h3>Type</h3>
                <p>${file.type}</p>
                <h3>Category</h3>
                <p>${file.category}</p>
                <h3>Key Learnings</h3>
                <div>${file.learnings.map((item) => `<div class="modal-tag">${item}</div>`).join('')}</div>
            `;

            document.getElementById('modalMain').innerHTML = `
                <h2 class="modal-title">${file.name}</h2>
                <p style="font-size: 1rem; line-height: 1.8; margin-bottom: 2rem; opacity: 0.9;">${file.purpose}</p>

                <h3 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2rem; margin-bottom: 1rem; opacity: 0.7;">Usage</h3>
                <div class="modal-code">${file.usage}</div>

                <h3 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2rem; margin-bottom: 1rem; opacity: 0.7;">Example</h3>
                <div class="modal-code">${file.example}</div>
            `;

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', (event) => {
            if (event.target.id === 'modal') closeModal();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
